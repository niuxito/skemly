<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Top node -->
  <rect x="9" y="3" width="14" height="8" rx="2" fill="#38bdf8"/>

  <!-- Connector: vertical then fork -->
  <line x1="16" y1="11" x2="16" y2="15" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="8"  y2="20" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="24" y2="20" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom-left node -->
  <rect x="1"  y="20" width="13" height="8" rx="2" fill="#818cf8"/>

  <!-- Bottom-right node -->
  <rect x="18" y="20" width="13" height="8" rx="2" fill="#818cf8"/>
</svg>
